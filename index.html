<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4f46">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="シフト管理マン">
  <meta name="mobile-web-app-capable" content="yes">
  <title>シフト管理マン v1.2</title>
  <!-- 更新時はCACHE_NAMEも更新する -->
  <meta name="description" content="日勤・夜勤・明け・休みを月単位で記録するカレンダー">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <style>
    :root {
      color-scheme: light;
      font-family: "Yu Gothic UI", "Hiragino Sans", sans-serif;
      --bg: #f4efe5;
      --panel: rgba(255, 251, 243, 0.92);
      --panel-strong: #fffdf8;
      --line: #d8ccb8;
      --text: #2d332d;
      --muted: #6f736a;
      --accent: #1f4f46;
      --accent-soft: #d9ebe4;
      --today: #f3c45b;
      --night: #23408e;
      --day: #2f7d4f;
      --after: #af6c1b;
      --off: #8f5d5d;
      --shadow: 0 18px 40px rgba(68, 50, 26, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 212, 122, 0.4), transparent 30%),
        radial-gradient(circle at top right, rgba(94, 151, 136, 0.28), transparent 28%),
        linear-gradient(180deg, #f9f2e7 0%, var(--bg) 100%);
    }

    main {
      width: min(100%, 1080px);
      margin: 0 auto;
      padding:
        calc(24px + env(safe-area-inset-top, 0px))
        calc(16px + env(safe-area-inset-right, 0px))
        calc(48px + env(safe-area-inset-bottom, 0px))
        calc(16px + env(safe-area-inset-left, 0px));
    }

    .app-shell {
      display: grid;
      gap: 20px;
    }

    .calendar-card,
    .summary-card,
    .mode-card {
      border: 1px solid rgba(143, 121, 90, 0.18);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .status-pill,
    .device-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      font-size: 0.95rem;
    }

    .device-badge {
      justify-content: center;
      background: #f4ebdd;
      color: var(--text);
      border: 1px solid rgba(141, 116, 79, 0.1);
    }

    .layout {
      display: grid;
      gap: 20px;
      grid-template-columns: minmax(0, 1.7fr) minmax(280px, 0.95fr);
      align-items: start;
    }

    .calendar-card,
    .summary-card,
    .mode-card {
      padding: 20px;
    }

    .calendar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .month-title {
      margin: 0;
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      line-height: 1.1;
    }

    .nav-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .nav-button,
    .clear-button,
    .status-button,
    .install-button {
      border: 0;
      border-radius: 16px;
      font: inherit;
      cursor: pointer;
      transition: transform 140ms ease, box-shadow 140ms ease, background-color 140ms ease;
    }

    .nav-button {
      min-width: 56px;
      min-height: 48px;
      padding: 0 16px;
      background: #efe5d3;
      color: var(--text);
      box-shadow: inset 0 0 0 1px rgba(105, 93, 72, 0.08);
    }

    .clear-button {
      min-height: 48px;
      padding: 0 16px;
      background: #d96b5f;
      color: #fffaf5;
      box-shadow: inset 0 0 0 1px rgba(104, 37, 27, 0.08);
    }

    .nav-button:hover,
    .nav-button:focus-visible,
    .clear-button:hover,
    .clear-button:focus-visible,
    .status-button:hover,
    .status-button:focus-visible,
    .install-button:hover,
    .install-button:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(55, 43, 26, 0.14);
      outline: none;
    }

    .calendar-frame {
      padding: 14px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255, 251, 243, 0.98), rgba(250, 244, 233, 0.94));
      border: 1px solid rgba(140, 113, 75, 0.12);
    }

    .weekday-row,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 10px;
    }

    .weekday-row {
      margin-bottom: 10px;
    }

    .weekday {
      display: grid;
      place-items: center;
      min-height: 36px;
      border-radius: 14px;
      background: #efe3d1;
      color: var(--muted);
      font-size: 0.94rem;
      font-weight: 700;
    }

    .calendar-grid {
      grid-auto-rows: minmax(102px, 1fr);
      touch-action: pan-y;
    }

    .day-cell {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
      padding: 12px;
      border-radius: 20px;
      background: var(--panel-strong);
      border: 1px solid rgba(148, 126, 96, 0.14);
      min-width: 0;
      position: relative;
      overflow: hidden;
    }

    .day-cell.is-outside {
      opacity: 0.48;
      background: rgba(244, 238, 225, 0.72);
    }

    .day-cell.is-today {
      border-color: rgba(243, 196, 91, 0.92);
      box-shadow: inset 0 0 0 1px rgba(243, 196, 91, 0.62);
    }

    .day-number {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-weight: 700;
      text-align: center;
    }

    .day-number small {
      color: var(--muted);
      font-weight: 600;
      display: none;
    }

    .status-button {
      width: 100%;
      min-height: 54px;
      font-size: clamp(1.1rem, 2.8vw, 1.5rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #fffdf8;
      background: var(--day);
    }

    .status-button[data-status="日"] {
      background: var(--day);
    }

    .status-button[data-status="夜"] {
      background: var(--night);
    }

    .status-button[data-status="明"] {
      background: var(--after);
    }

    .status-button[data-status="休"] {
      background: var(--off);
    }

    .status-button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
      transform: none;
      box-shadow: none;
    }

    .side-column {
      display: grid;
      gap: 20px;
    }

    .helper-card,
    .install-card {
      padding: 20px;
      border-radius: 28px;
      border: 1px solid rgba(143, 121, 90, 0.18);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .card-title {
      margin: 0 0 14px;
      font-size: 1.18rem;
    }

    .mode-options {
      display: grid;
      gap: 12px;
    }

    .mode-option {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-radius: 20px;
      background: #f5ede0;
      border: 1px solid rgba(130, 111, 85, 0.1);
      cursor: pointer;
      transition: background-color 140ms ease, border-color 140ms ease;
    }

    .mode-option:hover {
      background: #f0e5d3;
    }

    .mode-option input {
      margin: 0;
      accent-color: var(--accent);
    }

    .mode-option.is-locked {
      opacity: 0.72;
    }

    .mode-option.is-active {
      background: #eadbc2;
      border-color: rgba(31, 79, 70, 0.26);
    }

    .mode-option strong {
      display: block;
      font-size: 1rem;
    }

    .mode-option span {
      display: block;
      color: var(--muted);
      font-size: 0.92rem;
      margin-top: 2px;
    }

    .summary-grid {
      display: grid;
      gap: 12px;
    }

    .metric {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 18px;
      background: #f8f1e7;
      border: 1px solid rgba(141, 116, 79, 0.1);
    }

    .metric strong {
      font-size: 1.65rem;
      line-height: 1;
    }

    .pay-form {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field label {
      font-weight: 700;
    }

    .field input {
      width: 100%;
      min-height: 46px;
      padding: 0 14px;
      border: 1px solid #d7c8b2;
      border-radius: 14px;
      font: inherit;
      background: #fffdf8;
      color: var(--text);
    }

    .field input:focus-visible {
      outline: 2px solid rgba(31, 79, 70, 0.25);
      outline-offset: 2px;
    }

    .salary-box {
      margin-top: 18px;
      padding: 18px;
      border-radius: 22px;
      background:
        linear-gradient(135deg, rgba(31, 79, 70, 0.97), rgba(44, 104, 92, 0.94)),
        var(--accent);
      color: #fffef8;
    }

    .salary-box p {
      margin: 0;
      color: rgba(255, 254, 248, 0.82);
    }

    .salary-box strong {
      display: block;
      margin-top: 8px;
      font-size: clamp(1.9rem, 5vw, 2.7rem);
      line-height: 1;
      letter-spacing: 0.03em;
    }

    .status-row {
      margin-top: 20px;
    }

    .status-pill {
      width: 100%;
      justify-content: center;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(31, 79, 70, 0.1);
    }

    .status-pill.is-error {
      background: #fbe3df;
      color: #8a2b1f;
    }

    .install-card p,
    .helper-card p,
    .helper-card li {
      line-height: 1.7;
      color: var(--muted);
    }

    .install-card-actions {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .install-button {
      min-height: 48px;
      padding: 0 18px;
      font-weight: 800;
      color: #fffef8;
      background: var(--accent);
    }

    .install-button:disabled {
      cursor: default;
      opacity: 0.5;
      transform: none;
      box-shadow: none;
    }

    .clear-button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
      transform: none;
      box-shadow: inset 0 0 0 1px rgba(104, 37, 27, 0.08);
    }

    .install-hint {
      margin: 12px 0 0;
      font-size: 0.94rem;
    }

    .guide-list {
      margin: 12px 0 0;
      padding-left: 1.25rem;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .side-column {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 680px) {
      main {
        padding:
          calc(18px + env(safe-area-inset-top, 0px))
          calc(12px + env(safe-area-inset-right, 0px))
          calc(32px + env(safe-area-inset-bottom, 0px))
          calc(12px + env(safe-area-inset-left, 0px));
      }

      .calendar-card,
      .summary-card,
      .mode-card {
        border-radius: 24px;
      }

      .calendar-head {
        align-items: start;
        flex-direction: column;
      }

      .nav-buttons {
        width: 100%;
      }

      .nav-button,
      .clear-button {
        flex: 1;
      }

      .calendar-frame {
        padding: 8px;
      }

      .weekday-row,
      .calendar-grid {
        gap: 6px;
      }

      .calendar-grid {
        grid-auto-rows: minmax(82px, 1fr);
      }

      .day-cell {
        gap: 8px;
        padding: 8px 6px;
        border-radius: 14px;
      }

      .weekday {
        min-height: 32px;
        font-size: 0.88rem;
      }

      .day-number {
        gap: 4px;
        font-size: 0.95rem;
      }

      .day-number small {
        font-size: 0.72rem;
      }

      .status-button {
        min-height: 46px;
        font-size: 1rem;
      }
      .side-column {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 430px) {
      .calendar-frame {
        padding: 6px;
      }

      .weekday-row,
      .calendar-grid {
        gap: 4px;
      }

      .calendar-grid {
        grid-auto-rows: minmax(76px, 1fr);
      }

      .day-cell {
        padding: 7px 5px;
      }

      .status-button {
        min-height: 42px;
        font-size: 0.94rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="app-shell">
      <div class="layout">
        <section class="calendar-card">
          <div class="calendar-head">
            <div>
              <h2 class="month-title" id="monthTitle"></h2>
            </div>
            <div class="nav-buttons">
              <button class="nav-button" id="shareMonthButton" type="button" aria-label="表示中の月のシフトをコピーする">共有</button>
              <button class="nav-button" id="prevMonthButton" type="button" aria-label="前月へ">前月</button>
              <button class="nav-button" id="nextMonthButton" type="button" aria-label="次月へ">次月</button>
              <button class="clear-button" id="clearMonthButton" type="button" aria-label="表示中の月を全て休にする">クリア</button>
            </div>
          </div>

          <div class="calendar-frame" id="calendarFrame">
            <div class="weekday-row" id="weekdayRow"></div>
            <div class="calendar-grid" id="calendarGrid"></div>
          </div>

          <div class="status-row">
            <p class="status-pill" id="status" role="status" aria-live="polite">アプリを初期化しています。</p>
          </div>
        </section>

        <div class="side-column">
          <section class="mode-card">
            <h2 class="card-title">モード</h2>
            <div class="mode-options" id="modeOptions">
              <label class="mode-option" id="editModeOption">
                <input type="radio" name="mode" value="edit">
                <span>
                  <strong>編集モード：状態変更可能</strong>
                </span>
              </label>
              <label class="mode-option" id="lockModeOption">
                <input type="radio" name="mode" value="lock">
                <span>
                  <strong>ロックモード：状態変更不可</strong>
                </span>
              </label>
            </div>
          </section>

          <section class="summary-card">
            <h2 class="card-title">給与計算</h2>
            <div class="summary-grid">
              <div class="metric">
                <span>日勤回数</span>
                <strong id="dayCount">0</strong>
              </div>
              <div class="metric">
                <span>夜勤回数</span>
                <strong id="nightCount">0</strong>
              </div>
              <div class="metric">
                <span>勤務回数</span>
                <strong id="workCount">0</strong>
              </div>
            </div>

            <div class="pay-form">
              <div class="field">
                <label for="dayRateInput">日勤単価</label>
                <input id="dayRateInput" inputmode="numeric" min="0" placeholder="例: 10000" type="number">
              </div>
              <div class="field">
                <label for="nightRateInput">夜勤単価</label>
                <input id="nightRateInput" inputmode="numeric" min="0" placeholder="例: 23400" type="number">
              </div>
            </div>

            <div class="salary-box">
              <p>額面給与</p>
              <strong id="salaryValue">¥0</strong>
            </div>
          </section>

          <section class="helper-card">
            <h2 class="card-title">操作方法</h2>
            <p>状態ボタンを押すと `日 → 夜 → 明 → 休` の順で変更。月末を除き 夜 の次は 明 へ自動で変更</p>
            <ul class="guide-list">
              <li>カレンダーの左右スワイプ対応</li>
              <li>前月 / 次月ボタンでも移動可能</li>
              <li>ロックモードで誤動作防止</li>
              <li>共有ボタンでテキストコピー</li>
            </ul>
          </section>

          <section class="install-card">
            <h2 class="card-title">ホーム画面追加</h2>
            <p id="installDescription">Android ではインストールボタン、iPhone では共有メニューからホーム画面に追加できます。</p>
            <p class="install-hint" id="installHint">利用中の端末に合わせて案内を表示します。</p>
            <div class="install-card-actions">
              <button class="install-button" id="installButton" type="button" hidden>ホーム画面に追加</button>
              <span class="device-badge" id="deviceBadge">ブラウザ利用</span>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "shift-calendar-monthly-data-v1";
    const SHARED_SETTINGS_KEY = "__sharedSettings";
    const STATUS_ORDER = ["日", "夜", "明", "休"];
    const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];
    const TOUCH_THRESHOLD = 48;

    const monthTitle = document.getElementById("monthTitle");
    const weekdayRow = document.getElementById("weekdayRow");
    const calendarGrid = document.getElementById("calendarGrid");
    const calendarFrame = document.getElementById("calendarFrame");
    const status = document.getElementById("status");
    const dayCount = document.getElementById("dayCount");
    const nightCount = document.getElementById("nightCount");
    const workCount = document.getElementById("workCount");
    const dayRateInput = document.getElementById("dayRateInput");
    const nightRateInput = document.getElementById("nightRateInput");
    const salaryValue = document.getElementById("salaryValue");
    const shareMonthButton = document.getElementById("shareMonthButton");
    const prevMonthButton = document.getElementById("prevMonthButton");
    const nextMonthButton = document.getElementById("nextMonthButton");
    const clearMonthButton = document.getElementById("clearMonthButton");
    const modeOptions = document.getElementById("modeOptions");
    const editModeOption = document.getElementById("editModeOption");
    const lockModeOption = document.getElementById("lockModeOption");
    const installButton = document.getElementById("installButton");
    const installDescription = document.getElementById("installDescription");
    const installHint = document.getElementById("installHint");
    const deviceBadge = document.getElementById("deviceBadge");

    let store = loadStore();
    let currentDate = new Date();
    currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
    let touchStartX = null;
    let deferredInstallPrompt = null;

    renderWeekdays();
    updateInstallUI();
    render();
    registerServiceWorker();
    wireEvents();

    function wireEvents() {
      shareMonthButton.addEventListener("click", handleShareMonth);
      prevMonthButton.addEventListener("click", () => moveMonth(-1));
      nextMonthButton.addEventListener("click", () => moveMonth(1));
      clearMonthButton.addEventListener("click", clearCurrentMonth);
      installButton.addEventListener("click", handleInstallClick);

      modeOptions.addEventListener("change", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLInputElement) || target.name !== "mode") {
          return;
        }

        const sharedSettings = getSharedSettings();
        sharedSettings.mode = normalizeMode(target.value);
        persistStore();
        render();
        setStatus(sharedSettings.mode === "lock" ? "ロックモードに切り替えました。" : "編集モードに切り替えました。");
      });

      dayRateInput.addEventListener("input", () => updateRate("dayRate", dayRateInput.value));
      nightRateInput.addEventListener("input", () => updateRate("nightRate", nightRateInput.value));

      calendarGrid.addEventListener("click", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) {
          return;
        }

        const button = target.closest("[data-day-index]");
        if (!(button instanceof HTMLButtonElement)) {
          return;
        }

        handleStatusToggle(Number(button.dataset.dayIndex));
      });

      calendarFrame.addEventListener("touchstart", (event) => {
        if (event.changedTouches.length === 0) {
          return;
        }

        touchStartX = event.changedTouches[0].clientX;
      }, { passive: true });

      calendarFrame.addEventListener("touchend", (event) => {
        if (touchStartX === null || event.changedTouches.length === 0) {
          touchStartX = null;
          return;
        }

        const deltaX = event.changedTouches[0].clientX - touchStartX;
        touchStartX = null;

        if (Math.abs(deltaX) < TOUCH_THRESHOLD) {
          return;
        }

        moveMonth(deltaX < 0 ? 1 : -1);
      }, { passive: true });

      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        deferredInstallPrompt = event;
        updateInstallUI();
      });

      window.addEventListener("appinstalled", () => {
        deferredInstallPrompt = null;
        updateInstallUI();
        setStatus("ホーム画面への追加が完了しました。");
      });
    }

    function renderWeekdays() {
      weekdayRow.innerHTML = WEEKDAYS
        .map((weekday) => `<div class="weekday" aria-hidden="true">${weekday}</div>`)
        .join("");
    }

    function render() {
      const year = currentDate.getFullYear();
      const monthIndex = currentDate.getMonth();
      const monthState = getCurrentMonthState();
      const sharedSettings = getSharedSettings();
      const daysInMonth = getDaysInMonth(year, monthIndex);
      const dayEntries = buildCalendarEntries(year, monthIndex);

      monthTitle.textContent = `${year}年${monthIndex + 1}月`;
      dayRateInput.value = sharedSettings.dayRate;
      nightRateInput.value = sharedSettings.nightRate;

      const editRadio = modeOptions.querySelector('input[value="edit"]');
      const lockRadio = modeOptions.querySelector('input[value="lock"]');
      if (editRadio instanceof HTMLInputElement) {
        editRadio.checked = sharedSettings.mode === "edit";
      }
      if (lockRadio instanceof HTMLInputElement) {
        lockRadio.checked = sharedSettings.mode === "lock";
      }

      editModeOption.classList.toggle("is-locked", sharedSettings.mode === "lock");
      lockModeOption.classList.toggle("is-locked", sharedSettings.mode === "lock");
      editModeOption.classList.toggle("is-active", sharedSettings.mode === "edit");
      lockModeOption.classList.toggle("is-active", sharedSettings.mode === "lock");
      clearMonthButton.disabled = sharedSettings.mode === "lock";

      calendarGrid.innerHTML = dayEntries.map((entry) => {
        const isOutside = !entry.inCurrentMonth;
        const isToday = entry.inCurrentMonth && isCurrentToday(entry.date);
        const statusText = isOutside ? "" : monthState.shifts[entry.dayIndex];

        if (isOutside) {
          return `
            <article class="day-cell is-outside">
              <div class="day-number">
                <span>${entry.date.getDate()}</span>
                <small>${entry.date.getMonth() + 1}月</small>
              </div>
            </article>
          `;
        }

        const disabled = sharedSettings.mode === "lock" ? "disabled" : "";
        return `
          <article class="day-cell${isToday ? " is-today" : ""}">
            <div class="day-number">
              <span>${entry.date.getDate()}</span>
              <small>${entry.date.getMonth() + 1}月</small>
            </div>
            <button
              class="status-button"
              data-day-index="${entry.dayIndex}"
              data-status="${statusText}"
              type="button"
              aria-label="${entry.date.getDate()}日の状態は${statusText}"
              ${disabled}
            >${statusText}</button>
          </article>
        `;
      }).join("");

      const monthSummary = getMonthSummary(monthState.shifts);
      const monthlyPay = monthSummary.dayShiftCount * toNumber(sharedSettings.dayRate)
        + monthSummary.nightShiftCount * toNumber(sharedSettings.nightRate);

      dayCount.textContent = String(monthSummary.dayShiftCount);
      nightCount.textContent = String(monthSummary.nightShiftCount);
      workCount.textContent = String(monthSummary.totalWorkDays);
      salaryValue.textContent = formatCurrency(monthlyPay);

      // Ensure stale data never overflows the current month length.
      if (monthState.shifts.length !== daysInMonth) {
        monthState.shifts = normalizeShifts(monthState.shifts, daysInMonth);
        persistStore();
      }
    }

    function handleStatusToggle(dayIndex) {
      const sharedSettings = getSharedSettings();
      if (sharedSettings.mode === "lock") {
        setStatus("ロック中のため、状態ボタンは変更できません。");
        return;
      }

      const monthState = getCurrentMonthState();
      const currentStatus = monthState.shifts[dayIndex] || "休";
      const nextStatus = STATUS_ORDER[(STATUS_ORDER.indexOf(currentStatus) + 1) % STATUS_ORDER.length];
      monthState.shifts[dayIndex] = nextStatus;

      if (nextStatus === "夜" && dayIndex < monthState.shifts.length - 1) {
        monthState.shifts[dayIndex + 1] = "明";
      }

      persistStore();
      render();
      setStatus(`${dayIndex + 1}日の状態を「${nextStatus}」に変更しました。`);
    }

    function updateRate(field, value) {
      const sharedSettings = getSharedSettings();
      sharedSettings[field] = sanitizeRate(value);
      persistStore();
      render();
      setStatus("単価を保存しました。");
    }

    function clearCurrentMonth() {
      const sharedSettings = getSharedSettings();
      if (sharedSettings.mode === "lock") {
        setStatus("ロック中のため、クリアは実行できません。");
        return;
      }

      const monthState = getCurrentMonthState();
      monthState.shifts = Array.from({ length: monthState.shifts.length }, () => "休");
      persistStore();
      render();
      setStatus(`${currentDate.getFullYear()}年${currentDate.getMonth() + 1}月の状態を全て「休」にしました。`);
    }

    async function handleShareMonth() {
      try {
        await copyTextToClipboard(buildMonthShareText());
        setStatus(`${currentDate.getFullYear()}年${currentDate.getMonth() + 1}月のシフトをクリップボードにコピーしました。`);
      } catch (error) {
        console.error(error);
        setStatus("シフトのコピーに失敗しました。ブラウザの権限設定や HTTPS 配信を確認してください。", true);
      }
    }

    function moveMonth(offset) {
      currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + offset, 1);
      render();
      setStatus(`${currentDate.getFullYear()}年${currentDate.getMonth() + 1}月のデータを表示しています。`);
    }

    function buildCalendarEntries(year, monthIndex) {
      const firstDate = new Date(year, monthIndex, 1);
      const startDay = firstDate.getDay();
      const gridStart = new Date(year, monthIndex, 1 - startDay);
      const entries = [];

      for (let i = 0; i < 42; i += 1) {
        const date = new Date(gridStart);
        date.setDate(gridStart.getDate() + i);

        const inCurrentMonth = date.getMonth() === monthIndex;
        entries.push({
          date,
          inCurrentMonth,
          dayIndex: inCurrentMonth ? date.getDate() - 1 : -1
        });
      }

      return entries;
    }

    function buildMonthShareText() {
      const year = currentDate.getFullYear();
      const monthIndex = currentDate.getMonth();
      const monthState = getCurrentMonthState();
      const daysInMonth = getDaysInMonth(year, monthIndex);
      const monthSummary = getMonthSummary(monthState.shifts);
      const dayLines = Array.from({ length: daysInMonth }, (_, index) => `${index + 1}日：${monthState.shifts[index]}`);

      return [
        `${year}年${monthIndex + 1}月`,
        ...dayLines,
        "",
        `日勤回数：${monthSummary.dayShiftCount}回`,
        `夜勤回数：${monthSummary.nightShiftCount}回`,
        `勤務回数：${monthSummary.totalWorkDays}回`
      ].join("\n");
    }

    function getMonthSummary(shifts) {
      const dayShiftCount = shifts.filter((shift) => shift === "日").length;
      const nightShiftCount = shifts.filter((shift) => shift === "夜").length;

      return {
        dayShiftCount,
        nightShiftCount,
        totalWorkDays: dayShiftCount + nightShiftCount
      };
    }

    async function copyTextToClipboard(text) {
      if (window.isSecureContext && navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
        await navigator.clipboard.writeText(text);
        return;
      }

      if (fallbackCopyText(text)) {
        return;
      }

      throw new Error("Clipboard API unavailable");
    }

    function fallbackCopyText(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.setAttribute("readonly", "");
      textArea.style.position = "fixed";
      textArea.style.top = "0";
      textArea.style.left = "-9999px";
      textArea.style.opacity = "0";
      document.body.appendChild(textArea);

      const selection = document.getSelection();
      const originalRange = selection && selection.rangeCount > 0 ? selection.getRangeAt(0) : null;

      textArea.focus();
      textArea.select();
      textArea.setSelectionRange(0, textArea.value.length);

      let copied = false;
      try {
        copied = document.execCommand("copy");
      } finally {
        textArea.remove();
        if (selection) {
          selection.removeAllRanges();
          if (originalRange) {
            selection.addRange(originalRange);
          }
        }
      }

      return copied;
    }

    function getCurrentMonthState() {
      const key = getMonthKey(currentDate.getFullYear(), currentDate.getMonth());
      const daysInMonth = getDaysInMonth(currentDate.getFullYear(), currentDate.getMonth());

      if (!store[key]) {
        store[key] = createMonthState(daysInMonth);
      } else {
        store[key] = {
          shifts: normalizeShifts(store[key].shifts, daysInMonth)
        };
      }

      return store[key];
    }

    function getSharedSettings() {
      if (!store[SHARED_SETTINGS_KEY] || typeof store[SHARED_SETTINGS_KEY] !== "object") {
        store[SHARED_SETTINGS_KEY] = inferSharedSettingsFromLegacyData();
      } else {
        store[SHARED_SETTINGS_KEY] = {
          dayRate: sanitizeRate(store[SHARED_SETTINGS_KEY].dayRate),
          nightRate: sanitizeRate(store[SHARED_SETTINGS_KEY].nightRate),
          mode: normalizeMode(store[SHARED_SETTINGS_KEY].mode)
        };
      }

      return store[SHARED_SETTINGS_KEY];
    }

    function createMonthState(daysInMonth) {
      return {
        shifts: Array.from({ length: daysInMonth }, () => "休")
      };
    }

    function normalizeShifts(shifts, daysInMonth) {
      const safeShifts = Array.isArray(shifts) ? shifts.filter((shift) => STATUS_ORDER.includes(shift)) : [];
      return Array.from({ length: daysInMonth }, (_, index) => safeShifts[index] || "休");
    }

    function inferSharedSettingsFromLegacyData() {
      const currentMonthKey = getMonthKey(currentDate.getFullYear(), currentDate.getMonth());
      const currentMonth = store[currentMonthKey];
      const fallback = { dayRate: "", nightRate: "", mode: "edit" };

      if (currentMonth && typeof currentMonth === "object") {
        fallback.dayRate = sanitizeRate(currentMonth.dayRate);
        fallback.nightRate = sanitizeRate(currentMonth.nightRate);
        fallback.mode = normalizeMode(currentMonth.mode);
      }

      if (fallback.dayRate !== "" || fallback.nightRate !== "" || fallback.mode === "lock") {
        return fallback;
      }

      for (const [key, value] of Object.entries(store)) {
        if (key === SHARED_SETTINGS_KEY || !value || typeof value !== "object") {
          continue;
        }

        const dayRate = sanitizeRate(value.dayRate);
        const nightRate = sanitizeRate(value.nightRate);
        const mode = normalizeMode(value.mode);
        if (dayRate !== "" || nightRate !== "" || mode === "lock") {
          return { dayRate, nightRate, mode };
        }
      }

      return fallback;
    }

    function normalizeMode(value) {
      return value === "lock" ? "lock" : "edit";
    }

    function loadStore() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          return {};
        }

        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch (error) {
        console.error(error);
        setStatus("保存データの読み込みに失敗したため、新しいデータで開始します。", true);
        return {};
      }
    }

    function persistStore() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
      } catch (error) {
        console.error(error);
        setStatus("保存に失敗しました。ブラウザの保存容量を確認してください。", true);
      }
    }

    function getMonthKey(year, monthIndex) {
      return `${year}-${String(monthIndex + 1).padStart(2, "0")}`;
    }

    function getDaysInMonth(year, monthIndex) {
      return new Date(year, monthIndex + 1, 0).getDate();
    }

    function sanitizeRate(value) {
      if (value === null || value === undefined || value === "") {
        return "";
      }

      const stringValue = String(value).trim();
      if (!/^\d+$/.test(stringValue)) {
        return "";
      }

      return stringValue;
    }

    function toNumber(value) {
      return Number.parseInt(value || "0", 10) || 0;
    }

    function formatCurrency(value) {
      return `¥${value.toLocaleString("ja-JP")}`;
    }

    function isCurrentToday(date) {
      const today = new Date();
      return today.getFullYear() === date.getFullYear()
        && today.getMonth() === date.getMonth()
        && today.getDate() === date.getDate();
    }

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle("is-error", isError);
    }

    function updateInstallUI() {
      const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
      const isiPhone = /iPhone/.test(navigator.userAgent);
      const isAndroid = /Android/.test(navigator.userAgent);

      if (isStandalone) {
        installButton.hidden = true;
        deviceBadge.textContent = "ホーム画面利用中";
        installDescription.textContent = "このアプリはホーム画面から起動されています。";
        installHint.textContent = "そのままオフラインでも利用できます。";
        return;
      }

      if (deferredInstallPrompt) {
        installButton.hidden = false;
        installButton.disabled = false;
        deviceBadge.textContent = isAndroid ? "Android ブラウザ" : "ブラウザ利用";
        installDescription.textContent = "この端末では、ボタンからホーム画面追加を案内できます。";
        installHint.textContent = "「ホーム画面に追加」を押すとインストール確認が表示されます。";
        return;
      }

      installButton.hidden = true;

      if (isiPhone) {
        deviceBadge.textContent = "iPhone ブラウザ";
        installDescription.textContent = "iPhone では Safari の共有メニューからホーム画面に追加できます。";
        installHint.textContent = "Safari 下部の共有ボタンを開き、「ホーム画面に追加」を選択してください。";
        return;
      }

      if (isAndroid) {
        deviceBadge.textContent = "Android ブラウザ";
        installDescription.textContent = "Android ではブラウザのメニューからホーム画面追加できる場合があります。";
        installHint.textContent = "ブラウザのメニューに「インストール」や「ホーム画面に追加」が表示されるか確認してください。";
        return;
      }

      deviceBadge.textContent = "ブラウザ利用";
      installDescription.textContent = "このアプリはブラウザからも利用できます。";
      installHint.textContent = "ホーム画面追加に対応している場合は、ブラウザ側の案内が表示されます。";
    }

    async function handleInstallClick() {
      if (!deferredInstallPrompt) {
        updateInstallUI();
        return;
      }

      deferredInstallPrompt.prompt();
      const choice = await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      updateInstallUI();

      if (choice.outcome === "accepted") {
        setStatus("ホーム画面追加の確認を開始しました。");
      } else {
        setStatus("ホーム画面追加はキャンセルされました。");
      }
    }

    async function registerServiceWorker() {
      if (!("serviceWorker" in navigator)) {
        setStatus("このブラウザは Service Worker に対応していません。", true);
        return;
      }

      try {
        await navigator.serviceWorker.register("./sw.js");
        setStatus(`${currentDate.getFullYear()}年${currentDate.getMonth() + 1}月のデータを表示しています。`);
      } catch (error) {
        console.error(error);
        setStatus("Service Worker の登録に失敗しました。", true);
      }
    }
  </script>
</body>
</html>
